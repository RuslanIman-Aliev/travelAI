name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    # Placeholders only. Nothing in this job talks to a real service - every
    # route is dynamic, so `next build` never queries the database - but the
    # Prisma client and the Gemini client are both constructed at module scope
    # and refuse to be built without a value.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NEXTAUTH_SECRET: ci-placeholder-not-a-real-secret
      GEMINI_API_KEY: ci-placeholder
      NEST_API_URL: http://127.0.0.1:3001
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `postinstall` runs `prisma generate`, which the type check needs.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test -- --ci

      # Without this a production build that fails to compile still merges with a
      # green tick - `tsc --noEmit` does not exercise the bundler, the route
      # manifest, or the client/server boundary.
      - name: Build
        run: npm run build

      # The Nest app is excluded from the root tooling - it has its own configs -
      # so without these four steps it could be broken outright and this job
      # would still be green. `lint:check` and `format:check` rather than the
      # writing variants: CI has to fail on drift, not quietly repair it.
      - name: API format check
        run: npm run format:check -w api

      - name: API lint
        run: npm run lint:check -w api

      - name: API tests
        run: npm test -w api

      - name: API build
        run: npm run build -w api

  e2e:
    runs-on: ubuntu-latest
    # Playwright is configured but nothing ran it, so the one test covering the
    # browser-server-database seam never guarded anything.
    needs: verify

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: travel_ai_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/travel_ai_e2e
      NEXTAUTH_SECRET: e2e-placeholder-not-a-real-secret
      NEXTAUTH_URL: http://127.0.0.1:3000
      AUTH_TRUST_HOST: "true"
      GEMINI_API_KEY: e2e-placeholder
      NEST_API_URL: http://127.0.0.1:3001
      E2E_TEST_EMAIL: e2e@travel-ai.local
      E2E_TEST_NAME: E2E User
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Also the only place the migration history is exercised against a real
      # database, so a migration that does not apply fails here rather than on
      # the next deploy.
      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # `playwright.config.ts` starts both the dev server and the Inngest sink,
      # and sets `ENABLE_TEST_AUTH` for the sign-in shortcut.
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
